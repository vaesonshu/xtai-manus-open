# 本地开发依赖：Redis（缓存）+ PostgreSQL（业务数据库）
# 用法：在项目根目录执行 `docker compose up -d`

services:
  redis:
    image: redis:7-alpine
    container_name: xtai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    # AOF 持久化，开发环境重启后缓存数据不丢失（可按需关闭）
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: xtai-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: xtai
    # 宿主机用 5433，避免与 Windows/macOS 本机 PostgreSQL（默认 5432）冲突
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d xtai"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
